# This CI check builds and tests Merlin. Running the Merlin tests requires
# having a corresponding compiler, so the CI check builds the compiler at the
# same revision as the Merlin being tested.

name: merlin
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Overall approach to running the tests:
#  - Install OCaml 5.4, as this is the version of dependencies our merlin expects.
#  - Build OxCaml using a separate, pinned OxCaml bootstrap switch.
#  - Build merlin using OCaml 5.4 in its standalone Dune project, then run the
#    tests while pointing merlin at OxCaml's stdlib and ocamlc.
#
# The second step's result is cached, keyed by the hash of the commit being
# tested, so re-runs of the same commit can skip rebuilding the compiler.
#
# The check can be skipped by adding the merlin-emergency-skip label to the PR.

jobs:
  build:
    # The type of runner that the job will run on
    name: merlin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: flambda2

    env:
      MERLIN_TESTS: all
      EMERGENCY_SKIP_LABEL: merlin-emergency-skip

    steps:
    - name: 'Check for the "merlin-emergency-skip" PR label'
      if: contains(github.event.pull_request.labels.*.name, env.EMERGENCY_SKIP_LABEL)
      run: echo MERLIN_EMERGENCY_SKIP=y >> "$GITHUB_ENV"

    - name: 'Check for the "merlin-emergency-skip" PR label (merge queue)'
      if: github.event_name == 'merge_group'
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_REF: ${{ github.event.merge_group.head_ref }}
      run: |
        # HEAD_REF looks like refs/heads/gh-readonly-queue/main/pr-<N>-<sha>
        if [[ "$HEAD_REF" =~ /pr-([0-9]+)- ]]; then
          pr_number="${BASH_REMATCH[1]}"
          if gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
               --json labels --jq '.labels[].name' | grep -qxF "$EMERGENCY_SKIP_LABEL"; then
            echo MERLIN_EMERGENCY_SKIP=y >> "$GITHUB_ENV"
          fi
        else
          echo "Could not parse PR number from '$HEAD_REF'; not skipping the merlin check."
        fi

    - name: Checkout the oxcaml repo
      if: env.MERLIN_EMERGENCY_SKIP != 'y'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: 'oxcaml'
        persist-credentials: false

    - name: Assert Merlin is in sync with the compiler
      working-directory: oxcaml
      run: external/merlin/scripts/assert-in-sync.sh

    - name: Pretend we're running in a container (makes setup-ocaml go faster)
      if: env.MERLIN_EMERGENCY_SKIP != 'y' && runner.os == 'Linux'
      run: sudo touch /.dockerenv
      # makes setup-ocaml skip apt-get, which is slow on first invocation

    - name: Set up Opam
      if: env.MERLIN_EMERGENCY_SKIP != 'y'
      uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3.7.1
      with:
        ocaml-compiler: oxcaml-ci-deps.5.4.0-with-ocaml.5.4.0-with-ocamlformat.0.29.0
        opam-repositories: |
          local: file://${{ github.workspace }}/oxcaml/tools/ci/local-opam
          default: https://github.com/ocaml/opam-repository.git
        opam-disable-sandboxing: true
        opam-pin: false

    - name: Set up Opam environment
      if: env.MERLIN_EMERGENCY_SKIP != 'y'
      # this command adds the opam environment to the PATH.
      run: |
        opam env --set-root --set-switch --shell=cmd | sed -n 's/^set //p' | tee -a "$GITHUB_ENV"

    - name: Restore OxCaml build
      if: env.MERLIN_EMERGENCY_SKIP != 'y'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ github.workspace }}/flambda-backend/_install
        key: cache-flambda-backend-${{ matrix.name }}-${{ github.sha }}

    - name: Check out the OxCaml repo for the compiler build
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: env.MERLIN_EMERGENCY_SKIP != 'y' && steps.cache.outputs.cache-hit != 'true'
      with:
        path: 'flambda-backend'
        persist-credentials: false

    - name: Set up the OxCaml bootstrap switch
      if: env.MERLIN_EMERGENCY_SKIP != 'y' && steps.cache.outputs.cache-hit != 'true'
      run: |
        # Keep the upstream switch and its repository selection for Merlin.
        opam repository add --dont-select ox \
          git+https://github.com/oxcaml/opam-repository.git
        opam switch create oxcaml-bootstrap --yes --no-switch \
          --repositories=local,ox,default \
          --packages=oxcaml-ci-bootstrap.5.4.0-ox8

    - name: Configure, build, and install OxCaml
      if: env.MERLIN_EMERGENCY_SKIP != 'y' && steps.cache.outputs.cache-hit != 'true'
      working-directory: flambda-backend
      run: |
        eval "$(opam env --switch=oxcaml-bootstrap --set-switch)"
        autoconf
        ./configure \
          --prefix=$GITHUB_WORKSPACE/flambda-backend/_install \
          --with-opam-switch=oxcaml-bootstrap
        make install

    - name: Upload OxCaml cache
      if: env.MERLIN_EMERGENCY_SKIP != 'y' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/flambda-backend/_install
        key: cache-flambda-backend-${{ matrix.name }}-${{ github.sha }}

    - name: Install dependencies
      if: env.MERLIN_EMERGENCY_SKIP != 'y'
      working-directory: oxcaml/external/merlin
      run: |
        opam pin menhirLib 20231231 --no-action
        opam install --yes ppx_string ppx_compare ocamlformat.0.29.0
        opam install . --deps-only --with-test --yes

    - name: Build and test in release mode (linux)
      if: env.MERLIN_EMERGENCY_SKIP != 'y'
      working-directory: oxcaml/external/merlin
      run: |
        export MERLIN_TEST_OCAML_PATH=$GITHUB_WORKSPACE/flambda-backend/_install
        # Do not inherit the parent's OxCaml-only boot workspace flags.
        dune build --root .
        DUNE_CACHE=disabled dune build --root . @check @runtest
        if ! git diff --quiet ; then
          echo "The following files were modified by dune:" >&2
          git diff --name-only >&2
          echo "" >&2
          echo "Hint: If this check fails, the likely culprit is
        that you compiled with the wrong menhir version. Cross-check your opam switch's
        menhir version with the one in merlin-lib.opam" >&2
          exit 1
        fi

    - name: Note that the check was skipped
      if: env.MERLIN_EMERGENCY_SKIP == 'y'
      run: echo "All steps were skipped because the PR has the $EMERGENCY_SKIP_LABEL label."
