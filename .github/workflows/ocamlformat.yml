# CYBERSECURITY WARNING: DO NOT give workflows write permission to any source code repo.
# If you want this functionality, ask for help from a subset of:
# @jvanburen @glittershark @mshinwell
name: ocamlformat
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read # read PR labels for the "skip 80ch" check
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            os: warp-ubuntu-latest-x64-32x
    steps:
      - name: Checkout the OxCaml repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch the base for diff checks
        # In a pull_request job, HEAD is a synthetic merge of the PR into its
        # base branch. Right now we have a shallow checkout of _just_ that
        # merge commit, giving us nothing to diff against. A `git fetch` with
        # `--deepen 1` fixes it, but we have to be careful _what_ we deepen:
        # `HEAD` refers to the _remote's_ head, which may have shifted under
        # us. "$GITHUB_SHA" is the HEAD we actually want.
        run: git fetch origin "$GITHUB_SHA" --deepen 1

      - name: Pretend we're running in a container (makes setup-ocaml go faster)
        run: sudo touch /.dockerenv
        # makes setup-ocaml skip apt-get, which is slow on first invocation

      - name: Set up Opam
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: oxcaml-ci-deps.5.4.0-with-ocaml.5.4.0-with-ocamlformat.0.29.0
          opam-repositories: |
            local: file://${{ github.workspace }}/tools/ci/local-opam
            default: https://github.com/ocaml/opam-repository.git
          opam-disable-sandboxing: true
          opam-pin: false

      - name: 'Check for the "skip 80ch" PR tag'
        if: ${{ contains( github.event.pull_request.labels.*.name, 'skip 80ch') }}
        run: echo SKIP_80CH=y >> "$GITHUB_ENV"

      - name: 'Check for the "skip xxx" PR tag'
        if: ${{ contains( github.event.pull_request.labels.*.name, 'skip xxx') }}
        run: echo skip_xxx=y >> "$GITHUB_ENV"

      - name: 'Check for the "skip 80ch" and "skip xxx" PR tags (merge queue)'
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # HEAD_REF looks like refs/heads/gh-readonly-queue/main/pr-<N>-<sha>
          if [[ "$HEAD_REF" =~ /pr-([0-9]+)- ]]; then
            pr_number="${BASH_REMATCH[1]}"
            gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json labels --jq '
                .labels[].name
                | if   . == "skip 80ch" then "SKIP_80CH=y"
                  elif . == "skip xxx"  then "skip_xxx=y"
                  else empty end' >> "$GITHUB_ENV"
          else
            echo "Could not parse PR number from '$HEAD_REF'; not skipping 80ch."
          fi

      - name: Check OCaml Formatting
        run: opam exec -- bash tools/ci/actions/check-fmt.sh

      - name: Check for Conflict Markers
        if: ${{ !cancelled() }}
        run: bash tools/ci/actions/check-conflicts.sh

      - name: 'Check for New "xxx" Markers'
        if: ${{ !cancelled() }}
        run: |
          if [[ -z "${skip_xxx+x}" ]]; then
            bash scripts/check-xxx.sh
          fi
